<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d17">
<title>Council Stream</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  :root {
    --bg: #0b0d17;
    --panel: #161a32;
    --line: #2a3055;
    --text: #eef0ff;
    --muted: #8b92b8;
    --accent: #7c8cff;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 600px;
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .logo {
    font-weight: 700;
    font-size: 1.15rem;
  }
  .logo span { color: #3dd9c5; }
  .btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
  }
  .btn.danger-ghost {
    color: var(--danger);
    background: transparent;
    border-color: transparent;
    font-size: 0.8rem;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow: hidden;
  }
  .input-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: none;
  }
  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 16px; /* Prevents auto-zoom on iOS Safari */
    resize: vertical;
    min-height: 80px;
    line-height: 1.4;
  }
  textarea:focus {
    outline: 2px solid var(--accent);
    border-color: transparent;
  }
  .feed-container {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
    padding-right: 2px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 32px;
    gap: 8px;
  }
  .entry-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    word-break: break-word;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .entry-text {
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  #undoBar {
    display: none;
    background: #1e2340;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    align-items: center;
    justify-content: space-between;
    font-size: 0.88rem;
    flex: none;
  }
  #undoBar.show {
    display: flex;
  }
</style>
</head>
<body>

  <header>
    <div class="logo">AI <span>Council</span> Stream</div>
    <button type="button" class="btn danger-ghost" id="clearBtn">Clear All</button>
  </header>

  <div id="undoBar">
    <span>Entries cleared.</span>
    <button type="button" class="btn primary" id="undoBtn" style="min-height:36px; padding:4px 10px;">Undo</button>
  </div>

  <main>
    <div class="input-card">
      <textarea id="entryInput" placeholder="Record a note, idea, or decision..." enterkeyhint="send"></textarea>
      <div style="display: flex; justify-content: flex-end;">
        <button type="button" class="btn primary" id="saveBtn">Save Entry</button>
      </div>
    </div>

    <div class="feed-container" id="feedList">
      <!-- Dynamic entries rendered here -->
    </div>
  </main>

<script>
(function() {
  "use strict";

  var STORAGE_KEY = "council_stream_entries_v1";
  var entries = [];
  var lastClearedSession = null;

  function loadEntries() {
    try {
      var data = localStorage.getItem(STORAGE_KEY);
      if (data) entries = JSON.parse(data);
    } catch(e) {
      entries = [];
    }
  }

  function persistEntries() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch(e) {
      console.error("Storage full or unavailable");
    }
  }

  function render() {
    var list = document.getElementById("feedList");
    if (!entries.length) {
      list.innerHTML = '<div class="empty-state"><h3>No entries yet</h3><p>Type your thoughts above and save them securely on your device.</p></div>';
      return;
    }

    var html = "";
    for (var i = 0; i < entries.length; i++) {
      var item = entries[i];
      var dateStr = new Date(item.ts).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
      html += '<div class="entry-card">' +
                '<div class="entry-header"><span>#' + (entries.length - i) + '</span><span>' + dateStr + '</span></div>' +
                '<div class="entry-text">' + escapeHtml(item.text) + '</div>' +
              '</div>';
    }
    list.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function addEntry() {
    var input = document.getElementById("entryInput");
    var val = input.value.trim();
    if (!val) return;

    entries.unshift({
      id: "e_" + Date.now() + Math.random().toString(36).slice(2, 6),
      text: val,
      ts: Date.now()
    });

    persistEntries();
    input.value = "";
    input.style.height = "auto";
    render();
  }

  function init() {
    loadEntries();
    render();

    var saveBtn = document.getElementById("saveBtn");
    var input = document.getElementById("entryInput");
    var clearBtn = document.getElementById("clearBtn");
    var undoBtn = document.getElementById("undoBtn");
    var undoBar = document.getElementById("undoBar");

    saveBtn.onclick = addEntry;

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        addEntry();
      }
    });

    clearBtn.onclick = function() {
      if (!entries.length) return;
      lastClearedSession = JSON.parse(JSON.stringify(entries));
      entries = [];
      persistEntries();
      render();
      undoBar.classList.add("show");
    };

    undoBtn.onclick = function() {
      if (lastClearedSession) {
        entries = lastClearedSession;
        lastClearedSession = null;
        persistEntries();
        render();
      }
      undoBar.classList.remove("show");
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
